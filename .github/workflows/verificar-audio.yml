# Transcribe la mezcla final con faster-whisper para comprobar que la locución se entiende
# por encima de la música (la verificación se hace midiendo, no escuchando).
name: Verificar audio

on:
  push:
    paths:
      - "mighty-minis-edicion/v2/entregables/mighty_minis_v2_mezcla.wav"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verificar-audio
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar
        run: pip install --quiet faster-whisper
      - name: Transcribir
        run: |
          python - <<'PY'
          import json
          from faster_whisper import WhisperModel
          ruta = "mighty-minis-edicion/v2/entregables/mighty_minis_v2_mezcla.wav"
          modelo = WhisperModel("small", device="cpu", compute_type="int8")
          segs, info = modelo.transcribe(ruta, language="en", word_timestamps=True, vad_filter=False)
          filas, lineas = [], []
          for s in segs:
              filas.append({"ini": round(s.start, 2), "fin": round(s.end, 2), "texto": s.text.strip(),
                            "palabras": [{"w": w.word.strip(), "ini": round(w.start, 2), "fin": round(w.end, 2),
                                          "p": round(w.probability, 2)} for w in (s.words or [])]})
              lineas.append(f"{s.start:6.2f}-{s.end:6.2f}  {s.text.strip()}")
          base = "mighty-minis-edicion/v2/entregables/verificacion_audio"
          json.dump(filas, open(base + ".json", "w"), ensure_ascii=False, indent=1)
          open(base + ".txt", "w").write("\n".join(lineas) + "\n")
          print("\n".join(lineas))
          PY
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add mighty-minis-edicion/v2/entregables/verificacion_audio.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Verifica la locución de la mezcla v2"
          for intento in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
