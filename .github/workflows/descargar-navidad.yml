# Descarga a este repo los archivos de Kling de la serie A CAG Clay Christmas.
# Cada capítulo tiene su lista en clay-christmas/<capitulo>/descargas.txt
# (una línea por archivo: "nombre url"). Los archivos quedan en
# clay-christmas/<capitulo>/descargas/. Se ejecuta cuando cambia una lista.
name: Descargar archivos de Kling (Clay Christmas)

on:
  push:
    paths:
      - "clay-christmas/*/descargas.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: descargar-navidad
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Descargar los archivos de cada lista
        run: |
          for LISTA in clay-christmas/*/descargas.txt; do
            DESTINO="$(dirname "$LISTA")/descargas"
            mkdir -p "$DESTINO"
            while read -r nombre url; do
              case "$nombre" in ""|\#*) continue ;; esac
              ext="${url%%\?*}"; ext="${ext##*.}"
              archivo="$DESTINO/$nombre.$ext"
              if [ -s "$archivo" ]; then continue; fi
              if curl -fsSL --retry 3 --max-time 300 -o "$archivo" "$url"; then
                echo "Descargado: $archivo ($(stat -c%s "$archivo") bytes)"
              else
                echo "::warning::No se pudo descargar $nombre"
                rm -f "$archivo"
              fi
            done < "$LISTA"
          done

      - name: Guardar en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add clay-christmas
          if git diff --cached --quiet; then echo "Nada nuevo"; exit 0; fi
          git commit -m "Descarga archivos de Kling (Clay Christmas)"
          for intento in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
